<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Film stock plate. Tiled at a fixed size by .gl-grain so it never
       scales with the element it sits on. Opacity is set by the token. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch" seed="7" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="160" height="160" filter="url(#grain)" />
</svg>
